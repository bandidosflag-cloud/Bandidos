name: Notificaciones

on:
  schedule:
    # cada 15 min: avisos nuevos de la hoja marcados "notificar = si"
    # (el recordatorio de entreno sale en la primera corrida después de las 14:00 de Cuernavaca)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.guardar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Avisos y recordatorio de entreno
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python scripts/notificar.py --avisos --entreno
      - name: Archivos de calendario (por si cambió el uniforme o la sede en la hoja)
        run: python scripts/calendario.py
      - name: Guardar lo ya notificado
        id: guardar
        run: |
          git add scripts/estado/notificado.json app/cal 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada nuevo."; exit 0; fi
          if ! git diff --cached --quiet -- app/cal; then echo "publicar=true" >> "$GITHUB_OUTPUT"; fi
          git config user.name "bandidos-bot"
          git config user.email "bandidos-bot@users.noreply.github.com"
          git commit -m "Notificaciones y calendario $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q origin main
          git push

  publicar:
    needs: notificar
    if: needs.notificar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
